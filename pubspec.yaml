name: fyp_civic_connect
description: "Community issue reporting and progress tracking for Fateh Jang."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_maps_flutter: ^2.2.0
  geolocator: ^13.0.4
  uuid: ^4.5.1
  supabase_flutter: ^2.8.2
  app_links: ^6.3.3
  web: ^1.1.0
  intl: ^0.20.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  google_maps_flutter_platform_interface: ^2.9.5
  flutter_launcher_icons: ^0.9.2
  http: ^1.2.2

flutter_icons:
  image_path: "assets/images/Logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
  assets:
    - assets/fonts/OFL.txt
