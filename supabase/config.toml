# Deliberately scoped partial configuration for Supabase CLI v3.
# No hosted project identifiers or credentials belong in this file.
project_id = "civic-connect"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:*/**", "http://127.0.0.1:*/**", "io.supabase.civicconnect://auth-callback/"]
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
